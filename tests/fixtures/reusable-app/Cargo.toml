[workspace]
resolver = "2"
members = ["crates/*"]
default-members = ["crates/fixture-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
edgezero-core = { path = "../../../crates/edgezero-core", default-features = false }
edgezero-adapter-fastly = { path = "../../../crates/edgezero-adapter-fastly", features = ["fastly"] }
edgezero-adapter-cloudflare = { path = "../../../crates/edgezero-adapter-cloudflare", features = ["cloudflare"] }
edgezero-adapter-spin = { path = "../../../crates/edgezero-adapter-spin", features = ["spin"] }
edgezero-adapter-axum = { path = "../../../crates/edgezero-adapter-axum" }
fixture-core = { path = "crates/fixture-core" }
fastly = "=0.13.1"
worker = { version = "=0.8.5", default-features = false, features = ["http"] }
spin-sdk = { version = "=7.0.0", default-features = false }
futures = "0.3"
serde_json = "1"
log = "0.4"

[workspace.lints.rust]
unsafe_code = "deny"
