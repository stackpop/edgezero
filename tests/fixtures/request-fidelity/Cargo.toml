[package]
name = "request-fidelity"
version = "0.1.0"
edition = "2024"
publish = false

[package.metadata.request-fidelity]
spin-cli = "4.0.0"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "request-fidelity-fastly"
path = "src/bin/fastly.rs"
required-features = ["fastly"]

[features]
default = []
fastly = ["dep:edgezero-adapter-fastly", "dep:fastly"]
cloudflare = ["dep:edgezero-adapter-cloudflare", "dep:worker", "dep:wasm-bindgen"]
spin = ["dep:edgezero-adapter-spin", "dep:spin-sdk", "dep:anyhow"]

[dependencies]
async-trait = "=0.1.89"
edgezero-core = { path = "../../../crates/edgezero-core" }
edgezero-adapter-fastly = { path = "../../../crates/edgezero-adapter-fastly", features = ["fastly"], optional = true }
edgezero-adapter-cloudflare = { path = "../../../crates/edgezero-adapter-cloudflare", features = ["cloudflare"], optional = true }
edgezero-adapter-spin = { path = "../../../crates/edgezero-adapter-spin", features = ["spin"], optional = true }
fastly = { version = "=0.12.1", optional = true }
worker = { version = "=0.8.3", default-features = false, features = ["http"], optional = true }
wasm-bindgen = { version = "=0.2.122", optional = true }
spin-sdk = { version = "=6.0.0", default-features = false, features = ["http"], optional = true }
anyhow = { version = "=1.0.103", optional = true }
serde_json = "=1.0.150"
