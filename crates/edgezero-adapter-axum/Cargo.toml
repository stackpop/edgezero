[package]
name = "edgezero-adapter-axum"
description = "Axum adapter for EdgeZero: native Tokio dev server"
authors = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
version = { workspace = true }

[lints]
workspace = true

[features]
default = ["axum"]
axum = [
    "dep:async-stream",
    "dep:axum",
    "dep:tokio",
    "dep:tower",
    "dep:futures-util",
    "dep:http-body",
    "dep:hyper",
    "dep:hyper-util",
    "dep:ipnet",
    "dep:getrandom",
    "dep:mime",
    "dep:reqwest",
    "dep:redb",
]
cli = [
    "dep:edgezero-adapter",
    "edgezero-adapter/cli",
    "dep:ctor",
    "dep:toml",
    "dep:walkdir",
]
test-utils = ["dep:serde", "dep:validator"]

[dependencies]
edgezero-adapter = { path = "../edgezero-adapter", optional = true, features = [
    "cli",
] }
edgezero-core = { path = "../edgezero-core" }
anyhow = { workspace = true }
async-trait = { workspace = true }
async-stream = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
bytes = { workspace = true }
ctor = { workspace = true, optional = true }
futures = { workspace = true }
futures-util = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
http = { workspace = true }
http-body = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
ipnet = { workspace = true, optional = true }
log = { workspace = true }
mime = { workspace = true, optional = true }
redb = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true }
validator = { workspace = true, optional = true }
simple_logger = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
tracing = { workspace = true }
walkdir = { workspace = true, optional = true }

[[bin]]
name = "edgezero-hosting-fixture"
path = "tests/fixtures/production_host.rs"
required-features = ["axum", "test-utils"]
test = false

[dev-dependencies]
async-trait = { workspace = true }
axum = { workspace = true, features = ["macros"] }
edgezero-core = { path = "../edgezero-core", features = ["test-utils"] }
flate2 = { workspace = true }
http-body = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "rt-multi-thread"] }
tokio-rustls = { workspace = true }
