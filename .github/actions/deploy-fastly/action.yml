name: EdgeZero deploy-fastly
description: Deploy a verified immutable EdgeZero application release to Fastly Compute.

inputs:
  app-release-archive:
    description: Path to the pinned application release archive produced by the application release pipeline.
    required: true
  app-release-sha256:
    description: Expected lowercase SHA-256 digest of app-release-archive.
    required: true
  expected-source-revision:
    description: Full source revision that release.json must record.
    required: true
  fastly-api-token:
    description: Fastly API token, scoped only to provider operations.
    required: true
  fastly-service-id:
    description: Alphanumeric Fastly service ID.
    required: true
  deploy-args:
    description: JSON array containing only allowed Fastly deploy comment arguments.
    required: false
    default: "[]"
  deploy-to:
    description: "'production' activates the prepared version; 'staging' stages it."
    required: false
    default: production

outputs:
  fastly-version:
    description: Prepared Fastly version; it can remain available when a later deploy operation fails.
    value: ${{ steps.deploy.outputs['fastly-version'] }}
  mutation-attempted:
    description: "'true' when the application CLI was invoked for deployment."
    value: ${{ steps.deploy.outputs['mutation-attempted'] }}
  provider-cli-version:
    description: Pinned Fastly CLI version installed by this action.
    value: ${{ steps.install-fastly.outputs['provider-cli-version'] }}
  previous-version:
    description: Production version active before this deployment, when one exists.
    value: ${{ steps.capture.outputs['previous-version'] }}
  source-revision:
    description: Source revision recorded by the verified application release.
    value: ${{ steps.release.outputs['source-revision'] }}
  app-cli-version:
    description: Version of the application CLI recorded by the release.
    value: ${{ steps.cli.outputs['app-cli-version'] }}
  package-digest:
    description: Verified SHA-256 digest of the immutable Fastly package.
    value: ${{ steps.deploy.outputs['package-digest'] }}

runs:
  using: composite
  steps:
    - name: Prepare action workspace
      id: ws
      shell: bash
      env:
        BASH_ENV: ""
        ENV: ""
        FASTLY_API_TOKEN: ""
        FASTLY_SERVICE_ID: ""
        FASTLY_TOKEN: ""
        FASTLY_KEY: ""
        FASTLY_API_KEY: ""
        FASTLY_AUTH_TOKEN: ""
        FASTLY_API_ENDPOINT: ""
        FASTLY_ENDPOINT: ""
        FASTLY_API_URL: ""
        FASTLY_PROFILE: ""
        FASTLY_SERVICE_NAME: ""
        FASTLY_DEBUG: ""
        FASTLY_DEBUG_MODE: ""
        FASTLY_CONFIG_FILE: ""
        FASTLY_CARGO_PROFILE: ""
        FASTLY_HOME: ""
      run: exec "$GITHUB_ACTION_PATH/../deploy-core/scripts/prepare-workspace.sh"

    - name: Validate inputs
      id: validate
      shell: bash
      env:
        BASH_ENV: ""
        ENV: ""
        EDGEZERO__ADAPTER: fastly
        EDGEZERO__BUILD__MODE: never
        EDGEZERO__BUILD__CACHE: "false"
        EDGEZERO__BUILD__ARGS: "[]"
        EDGEZERO__DEPLOY__ARGS: ${{ inputs['deploy-args'] }}
        EDGEZERO__DEPLOY__ARG_ALLOW: "--comment="
        EDGEZERO__DEPLOY__ARGS_PREPEND: '["--non-interactive"]'
        EDGEZERO__DEPLOY__TO: ${{ inputs['deploy-to'] }}
        EDGEZERO__DEPLOY__FLAGS: ${{ inputs['deploy-to'] == 'staging' && format('["--service-id","{0}","--staging","--application-release","{1}/release"]', inputs['fastly-service-id'], steps.ws.outputs.root) || format('["--service-id","{0}","--application-release","{1}/release"]', inputs['fastly-service-id'], steps.ws.outputs.root) }}
        EDGEZERO__PROVIDER__ENV_CLEAR: '["FASTLY_API_TOKEN","FASTLY_SERVICE_ID","FASTLY_TOKEN","FASTLY_KEY","FASTLY_API_KEY","FASTLY_AUTH_TOKEN","FASTLY_API_ENDPOINT","FASTLY_ENDPOINT","FASTLY_API_URL","FASTLY_PROFILE","FASTLY_SERVICE_NAME","FASTLY_DEBUG","FASTLY_DEBUG_MODE","FASTLY_CONFIG_FILE","FASTLY_CARGO_PROFILE","FASTLY_HOME"]'
        EDGEZERO__APP__RELEASE__ARCHIVE_PRESENT: ${{ inputs['app-release-archive'] != '' && 'true' || 'false' }}
        EDGEZERO__APP__RELEASE__SHA256_PRESENT: ${{ inputs['app-release-sha256'] != '' && 'true' || 'false' }}
        EDGEZERO__FASTLY__API_TOKEN_PRESENT: ${{ inputs['fastly-api-token'] != '' && 'true' || 'false' }}
        EDGEZERO__FASTLY__SERVICE_ID: ${{ inputs['fastly-service-id'] }}
        EDGEZERO__RUNNER__OS: ${{ runner.os }}
        EDGEZERO__RUNNER__ARCH: ${{ runner.arch }}
        EDGEZERO__ACTION__STATE_DIR: ${{ steps.ws.outputs.root }}/state
        FASTLY_API_TOKEN: ""
        FASTLY_SERVICE_ID: ""
        FASTLY_TOKEN: ""
        FASTLY_KEY: ""
        FASTLY_API_KEY: ""
        FASTLY_AUTH_TOKEN: ""
        FASTLY_API_ENDPOINT: ""
        FASTLY_ENDPOINT: ""
        FASTLY_API_URL: ""
        FASTLY_PROFILE: ""
        FASTLY_SERVICE_NAME: ""
        FASTLY_DEBUG: ""
        FASTLY_DEBUG_MODE: ""
        FASTLY_CONFIG_FILE: ""
        FASTLY_CARGO_PROFILE: ""
        FASTLY_HOME: ""
      run: exec "$GITHUB_ACTION_PATH/scripts/validate.sh"

    - name: Verify application release
      id: release
      shell: bash
      env:
        BASH_ENV: ""
        ENV: ""
        EDGEZERO__APP__RELEASE__ARCHIVE: ${{ inputs['app-release-archive'] }}
        EDGEZERO__APP__RELEASE__SHA256: ${{ inputs['app-release-sha256'] }}
        EDGEZERO__APP__RELEASE__EXPECTED_SOURCE_REVISION: ${{ inputs['expected-source-revision'] }}
        EDGEZERO__APP__RELEASE__ROOT: ${{ steps.ws.outputs.root }}/release
        FASTLY_API_TOKEN: ""
        FASTLY_SERVICE_ID: ""
        FASTLY_TOKEN: ""
        FASTLY_KEY: ""
        FASTLY_API_KEY: ""
        FASTLY_AUTH_TOKEN: ""
        FASTLY_API_ENDPOINT: ""
        FASTLY_ENDPOINT: ""
        FASTLY_API_URL: ""
        FASTLY_PROFILE: ""
        FASTLY_SERVICE_NAME: ""
        FASTLY_DEBUG: ""
        FASTLY_DEBUG_MODE: ""
        FASTLY_CONFIG_FILE: ""
        FASTLY_CARGO_PROFILE: ""
        FASTLY_HOME: ""
      run: exec "$GITHUB_ACTION_PATH/../fastly-common/scripts/prepare-release.sh"

    - name: Extract application CLI
      id: cli
      shell: bash
      env:
        BASH_ENV: ""
        ENV: ""
        EDGEZERO__APP__CLI__ARCHIVE: ${{ steps.release.outputs['app-cli-archive'] }}
        EDGEZERO__ACTION__TOOL_ROOT: ${{ steps.ws.outputs.root }}/tools
        FASTLY_API_TOKEN: ""
        FASTLY_SERVICE_ID: ""
        FASTLY_TOKEN: ""
        FASTLY_KEY: ""
        FASTLY_API_KEY: ""
        FASTLY_AUTH_TOKEN: ""
        FASTLY_API_ENDPOINT: ""
        FASTLY_ENDPOINT: ""
        FASTLY_API_URL: ""
        FASTLY_PROFILE: ""
        FASTLY_SERVICE_NAME: ""
        FASTLY_DEBUG: ""
        FASTLY_DEBUG_MODE: ""
        FASTLY_CONFIG_FILE: ""
        FASTLY_CARGO_PROFILE: ""
        FASTLY_HOME: ""
      run: exec "$GITHUB_ACTION_PATH/../deploy-core/scripts/download-app-cli.sh"

    - name: Install Fastly CLI
      id: install-fastly
      shell: bash
      env:
        BASH_ENV: ""
        ENV: ""
        EDGEZERO__ACTION__ROOT: ${{ github.action_path }}/../../..
        EDGEZERO__FASTLY__VERSIONS_JSON: ${{ github.action_path }}/versions.json
        FASTLY_API_TOKEN: ""
        FASTLY_SERVICE_ID: ""
        FASTLY_TOKEN: ""
        FASTLY_KEY: ""
        FASTLY_API_KEY: ""
        FASTLY_AUTH_TOKEN: ""
        FASTLY_API_ENDPOINT: ""
        FASTLY_ENDPOINT: ""
        FASTLY_API_URL: ""
        FASTLY_PROFILE: ""
        FASTLY_SERVICE_NAME: ""
        FASTLY_DEBUG: ""
        FASTLY_DEBUG_MODE: ""
        FASTLY_CONFIG_FILE: ""
        FASTLY_CARGO_PROFILE: ""
        FASTLY_HOME: ""
      run: exec "$GITHUB_ACTION_PATH/scripts/install-fastly.sh"

    - name: Capture rollback target
      id: capture
      if: ${{ inputs['deploy-to'] != 'staging' }}
      shell: bash
      env:
        BASH_ENV: ""
        ENV: ""
        EDGEZERO__ACTION__WORKSPACE: ${{ steps.ws.outputs.root }}
        EDGEZERO__APP__CLI__PATH: ${{ steps.cli.outputs['app-cli-path'] }}
        EDGEZERO__FASTLY__SERVICE_ID: ${{ inputs['fastly-service-id'] }}
        FASTLY_API_TOKEN: ${{ inputs['fastly-api-token'] }}
        FASTLY_SERVICE_ID: ""
        FASTLY_TOKEN: ""
        FASTLY_KEY: ""
        FASTLY_API_KEY: ""
        FASTLY_AUTH_TOKEN: ""
        FASTLY_API_ENDPOINT: ""
        FASTLY_ENDPOINT: ""
        FASTLY_API_URL: ""
        FASTLY_PROFILE: ""
        FASTLY_SERVICE_NAME: ""
        FASTLY_DEBUG: ""
        FASTLY_DEBUG_MODE: ""
        FASTLY_CONFIG_FILE: ""
        FASTLY_CARGO_PROFILE: ""
        FASTLY_HOME: ""
      run: exec "$GITHUB_ACTION_PATH/scripts/capture-previous.sh"

    - name: Deploy
      id: deploy
      shell: bash
      env:
        BASH_ENV: ""
        ENV: ""
        EDGEZERO__ACTION__WORKSPACE: ${{ steps.ws.outputs.root }}
        EDGEZERO__APP__CLI__PATH: ${{ steps.cli.outputs['app-cli-path'] }}
        EDGEZERO__ADAPTER: fastly
        EDGEZERO__PROJECT__WORKING_DIRECTORY: ${{ steps.release.outputs['release-root'] }}
        EDGEZERO__PROJECT__MANIFEST_PATH: ${{ steps.release.outputs['application-manifest'] }}
        EDGEZERO__APP__RELEASE__PACKAGE_DIGEST: ${{ steps.release.outputs['package-digest'] }}
        EDGEZERO__DEPLOY__FLAGS_FILE: ${{ steps.validate.outputs['deploy-flags-file'] }}
        EDGEZERO__DEPLOY__ARGS_FILE: ${{ steps.validate.outputs['deploy-args-file'] }}
        EDGEZERO__PROVIDER__ENV_CLEAR_FILE: ${{ steps.validate.outputs['provider-env-clear-file'] }}
        EDGEZERO__FASTLY__API_TOKEN: ${{ inputs['fastly-api-token'] }}
        EDGEZERO__FASTLY__SERVICE_ID: ${{ inputs['fastly-service-id'] }}
        FASTLY_API_TOKEN: ""
        FASTLY_SERVICE_ID: ""
        FASTLY_TOKEN: ""
        FASTLY_KEY: ""
        FASTLY_API_KEY: ""
        FASTLY_AUTH_TOKEN: ""
        FASTLY_API_ENDPOINT: ""
        FASTLY_ENDPOINT: ""
        FASTLY_API_URL: ""
        FASTLY_PROFILE: ""
        FASTLY_SERVICE_NAME: ""
        FASTLY_DEBUG: ""
        FASTLY_DEBUG_MODE: ""
        FASTLY_CONFIG_FILE: ""
        FASTLY_CARGO_PROFILE: ""
        FASTLY_HOME: ""
      run: exec "$GITHUB_ACTION_PATH/scripts/deploy.sh"

    - name: Cleanup
      if: ${{ always() }}
      shell: bash
      env:
        BASH_ENV: ""
        ENV: ""
        EDGEZERO__ACTION__WORKSPACE: ${{ steps.ws.outputs.root }}
        EDGEZERO__ACTION__TOOL_ROOT: ${{ steps.ws.outputs.root }}/tools
        FASTLY_API_TOKEN: ""
        FASTLY_SERVICE_ID: ""
        FASTLY_TOKEN: ""
        FASTLY_KEY: ""
        FASTLY_API_KEY: ""
        FASTLY_AUTH_TOKEN: ""
        FASTLY_API_ENDPOINT: ""
        FASTLY_ENDPOINT: ""
        FASTLY_API_URL: ""
        FASTLY_PROFILE: ""
        FASTLY_SERVICE_NAME: ""
        FASTLY_DEBUG: ""
        FASTLY_DEBUG_MODE: ""
        FASTLY_CONFIG_FILE: ""
        FASTLY_CARGO_PROFILE: ""
        FASTLY_HOME: ""
      run: exec "$GITHUB_ACTION_PATH/../deploy-core/scripts/cleanup.sh"
