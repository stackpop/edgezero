name: EdgeZero rollback-fastly
description: Roll back a Fastly deployment with the application CLI from a verified immutable release.

inputs:
  app-release-archive:
    description: Path to the pinned application release archive.
    required: true
  app-release-sha256:
    description: Expected lowercase SHA-256 digest of the application release archive.
    required: true
  expected-source-revision:
    description: Full source revision that release.json must record.
    required: true
  fastly-api-token:
    description: Fastly API token, scoped only to rollback.
    required: true
  fastly-service-id:
    description: Alphanumeric Fastly service ID.
    required: true
  fastly-version:
    description: Current Fastly version to roll back.
    required: true
  rollback-to:
    description: Production version to reactivate; unused for staging rollback.
    required: false
    default: ""
  deploy-to:
    description: Deployment target, production or staging.
    required: false
    default: production

outputs:
  mutation-attempted:
    description: "'true' when the rollback CLI was invoked."
    value: ${{ steps.rollback.outputs['mutation-attempted'] }}
  rolled-back-to:
    description: Production version activated by rollback.
    value: ${{ steps.rollback.outputs['rolled-back-to'] }}

runs:
  using: composite
  steps:
    - name: Prepare action workspace
      id: ws
      shell: bash
      env:
        BASH_ENV: ""
        ENV: ""
        FASTLY_API_TOKEN: ""
        FASTLY_SERVICE_ID: ""
        FASTLY_TOKEN: ""
        FASTLY_KEY: ""
        FASTLY_API_KEY: ""
        FASTLY_AUTH_TOKEN: ""
        FASTLY_API_ENDPOINT: ""
        FASTLY_ENDPOINT: ""
        FASTLY_API_URL: ""
        FASTLY_PROFILE: ""
        FASTLY_SERVICE_NAME: ""
        FASTLY_DEBUG: ""
        FASTLY_DEBUG_MODE: ""
        FASTLY_CONFIG_FILE: ""
        FASTLY_CARGO_PROFILE: ""
        FASTLY_HOME: ""
      run: exec "$GITHUB_ACTION_PATH/../deploy-core/scripts/prepare-workspace.sh"

    - name: Validate inputs
      shell: bash
      env:
        BASH_ENV: ""
        ENV: ""
        EDGEZERO__APP__RELEASE__ARCHIVE_PRESENT: ${{ inputs['app-release-archive'] != '' && 'true' || 'false' }}
        EDGEZERO__APP__RELEASE__SHA256_PRESENT: ${{ inputs['app-release-sha256'] != '' && 'true' || 'false' }}
        EDGEZERO__FASTLY__SERVICE_ID: ${{ inputs['fastly-service-id'] }}
        FASTLY_API_TOKEN: ""
        FASTLY_SERVICE_ID: ""
        FASTLY_TOKEN: ""
        FASTLY_KEY: ""
        FASTLY_API_KEY: ""
        FASTLY_AUTH_TOKEN: ""
        FASTLY_API_ENDPOINT: ""
        FASTLY_ENDPOINT: ""
        FASTLY_API_URL: ""
        FASTLY_PROFILE: ""
        FASTLY_SERVICE_NAME: ""
        FASTLY_DEBUG: ""
        FASTLY_DEBUG_MODE: ""
        FASTLY_CONFIG_FILE: ""
        FASTLY_CARGO_PROFILE: ""
        FASTLY_HOME: ""
      run: exec "$GITHUB_ACTION_PATH/scripts/validate.sh"

    - name: Verify application release
      id: release
      shell: bash
      env:
        BASH_ENV: ""
        ENV: ""
        EDGEZERO__APP__RELEASE__ARCHIVE: ${{ inputs['app-release-archive'] }}
        EDGEZERO__APP__RELEASE__SHA256: ${{ inputs['app-release-sha256'] }}
        EDGEZERO__APP__RELEASE__EXPECTED_SOURCE_REVISION: ${{ inputs['expected-source-revision'] }}
        EDGEZERO__APP__RELEASE__EXPECTED_ADAPTER: fastly
        EDGEZERO__APP__RELEASE__EXPECTED_LIFECYCLE_PROTOCOL: "1"
        EDGEZERO__APP__RELEASE__ROOT: ${{ steps.ws.outputs.root }}/release
        FASTLY_API_TOKEN: ""
        FASTLY_SERVICE_ID: ""
        FASTLY_TOKEN: ""
        FASTLY_KEY: ""
        FASTLY_API_KEY: ""
        FASTLY_AUTH_TOKEN: ""
        FASTLY_API_ENDPOINT: ""
        FASTLY_ENDPOINT: ""
        FASTLY_API_URL: ""
        FASTLY_PROFILE: ""
        FASTLY_SERVICE_NAME: ""
        FASTLY_DEBUG: ""
        FASTLY_DEBUG_MODE: ""
        FASTLY_CONFIG_FILE: ""
        FASTLY_CARGO_PROFILE: ""
        FASTLY_HOME: ""
      run: exec "$GITHUB_ACTION_PATH/../release-core/scripts/prepare-release.sh"

    - name: Extract application CLI
      id: cli
      shell: bash
      env:
        BASH_ENV: ""
        ENV: ""
        EDGEZERO__APP__CLI__ARCHIVE: ${{ steps.release.outputs['app-cli-archive'] }}
        EDGEZERO__ACTION__TOOL_ROOT: ${{ steps.ws.outputs.root }}/tools
        FASTLY_API_TOKEN: ""
        FASTLY_SERVICE_ID: ""
        FASTLY_TOKEN: ""
        FASTLY_KEY: ""
        FASTLY_API_KEY: ""
        FASTLY_AUTH_TOKEN: ""
        FASTLY_API_ENDPOINT: ""
        FASTLY_ENDPOINT: ""
        FASTLY_API_URL: ""
        FASTLY_PROFILE: ""
        FASTLY_SERVICE_NAME: ""
        FASTLY_DEBUG: ""
        FASTLY_DEBUG_MODE: ""
        FASTLY_CONFIG_FILE: ""
        FASTLY_CARGO_PROFILE: ""
        FASTLY_HOME: ""
      run: exec "$GITHUB_ACTION_PATH/../deploy-core/scripts/download-app-cli.sh"

    - name: Rollback
      id: rollback
      shell: bash
      env:
        BASH_ENV: ""
        ENV: ""
        EDGEZERO__ACTION__WORKSPACE: ${{ steps.ws.outputs.root }}
        EDGEZERO__APP__CLI__PATH: ${{ steps.cli.outputs['app-cli-path'] }}
        EDGEZERO__LIFECYCLE__SERVICE_ID: ${{ inputs['fastly-service-id'] }}
        EDGEZERO__LIFECYCLE__VERSION: ${{ inputs['fastly-version'] }}
        EDGEZERO__LIFECYCLE__ROLLBACK_TO: ${{ inputs['rollback-to'] }}
        EDGEZERO__DEPLOY__TO: ${{ inputs['deploy-to'] }}
        EDGEZERO__FASTLY__API_TOKEN: ${{ inputs['fastly-api-token'] }}
        FASTLY_API_TOKEN: ""
        FASTLY_SERVICE_ID: ""
        FASTLY_TOKEN: ""
        FASTLY_KEY: ""
        FASTLY_API_KEY: ""
        FASTLY_AUTH_TOKEN: ""
        FASTLY_API_ENDPOINT: ""
        FASTLY_ENDPOINT: ""
        FASTLY_API_URL: ""
        FASTLY_PROFILE: ""
        FASTLY_SERVICE_NAME: ""
        FASTLY_DEBUG: ""
        FASTLY_DEBUG_MODE: ""
        FASTLY_CONFIG_FILE: ""
        FASTLY_CARGO_PROFILE: ""
        FASTLY_HOME: ""
      run: exec "$GITHUB_ACTION_PATH/scripts/rollback.sh"

    - name: Cleanup
      if: ${{ always() }}
      shell: bash
      env:
        BASH_ENV: ""
        ENV: ""
        EDGEZERO__ACTION__WORKSPACE: ${{ steps.ws.outputs.root }}
        EDGEZERO__ACTION__TOOL_ROOT: ${{ steps.ws.outputs.root }}/tools
        FASTLY_API_TOKEN: ""
        FASTLY_SERVICE_ID: ""
        FASTLY_TOKEN: ""
        FASTLY_KEY: ""
        FASTLY_API_KEY: ""
        FASTLY_AUTH_TOKEN: ""
        FASTLY_API_ENDPOINT: ""
        FASTLY_ENDPOINT: ""
        FASTLY_API_URL: ""
        FASTLY_PROFILE: ""
        FASTLY_SERVICE_NAME: ""
        FASTLY_DEBUG: ""
        FASTLY_DEBUG_MODE: ""
        FASTLY_CONFIG_FILE: ""
        FASTLY_CARGO_PROFILE: ""
        FASTLY_HOME: ""
      run: exec "$GITHUB_ACTION_PATH/../deploy-core/scripts/cleanup.sh"
