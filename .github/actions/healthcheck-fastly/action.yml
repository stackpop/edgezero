name: EdgeZero healthcheck-fastly
description: Probe a Fastly deployment with the application CLI from a verified immutable release.

inputs:
  app-release-archive:
    description: Path to the pinned application release archive.
    required: true
  app-release-sha256:
    description: Expected lowercase SHA-256 digest of the application release archive.
    required: true
  expected-source-revision:
    description: Full source revision that release.json must record.
    required: true
  fastly-service-id:
    description: Alphanumeric Fastly service ID.
    required: true
  fastly-version:
    description: Fastly version to probe.
    required: true
  domain:
    description: Deployment hostname to probe.
    required: true
  path:
    description: URL path to probe.
    required: false
    default: "/"
  retry:
    description: Total number of probe attempts.
    required: false
    default: "3"
  retry-delay:
    description: Seconds between probe attempts.
    required: false
    default: "5"
  timeout:
    description: Per-attempt timeout in seconds.
    required: false
    default: "10"
  deploy-to:
    description: Deployment target, production or staging.
    required: false
    default: production
  fastly-api-token:
    description: Fastly API token required only to resolve a staging deployment.
    required: false
    default: ""

outputs:
  healthy:
    description: Whether the deployment was proven healthy.
    value: ${{ steps.health.outputs.healthy }}
  status-code:
    description: Last HTTP status observed by the healthcheck.
    value: ${{ steps.health.outputs['status-code'] }}

runs:
  using: composite
  steps:
    - name: Prepare action workspace
      id: ws
      shell: bash
      env:
        BASH_ENV: ""
        ENV: ""
        FASTLY_API_TOKEN: ""
        FASTLY_SERVICE_ID: ""
        FASTLY_TOKEN: ""
        FASTLY_KEY: ""
        FASTLY_API_KEY: ""
        FASTLY_AUTH_TOKEN: ""
        FASTLY_API_ENDPOINT: ""
        FASTLY_ENDPOINT: ""
        FASTLY_API_URL: ""
        FASTLY_PROFILE: ""
        FASTLY_SERVICE_NAME: ""
        FASTLY_DEBUG: ""
        FASTLY_DEBUG_MODE: ""
        FASTLY_CONFIG_FILE: ""
        FASTLY_CARGO_PROFILE: ""
        FASTLY_HOME: ""
      run: exec "$GITHUB_ACTION_PATH/../deploy-core/scripts/prepare-workspace.sh"

    - name: Validate inputs
      shell: bash
      env:
        BASH_ENV: ""
        ENV: ""
        EDGEZERO__APP__RELEASE__ARCHIVE_PRESENT: ${{ inputs['app-release-archive'] != '' && 'true' || 'false' }}
        EDGEZERO__APP__RELEASE__SHA256_PRESENT: ${{ inputs['app-release-sha256'] != '' && 'true' || 'false' }}
        EDGEZERO__FASTLY__SERVICE_ID: ${{ inputs['fastly-service-id'] }}
        FASTLY_API_TOKEN: ""
        FASTLY_SERVICE_ID: ""
        FASTLY_TOKEN: ""
        FASTLY_KEY: ""
        FASTLY_API_KEY: ""
        FASTLY_AUTH_TOKEN: ""
        FASTLY_API_ENDPOINT: ""
        FASTLY_ENDPOINT: ""
        FASTLY_API_URL: ""
        FASTLY_PROFILE: ""
        FASTLY_SERVICE_NAME: ""
        FASTLY_DEBUG: ""
        FASTLY_DEBUG_MODE: ""
        FASTLY_CONFIG_FILE: ""
        FASTLY_CARGO_PROFILE: ""
        FASTLY_HOME: ""
      run: exec "$GITHUB_ACTION_PATH/scripts/validate.sh"

    - name: Verify application release
      id: release
      shell: bash
      env:
        BASH_ENV: ""
        ENV: ""
        EDGEZERO__APP__RELEASE__ARCHIVE: ${{ inputs['app-release-archive'] }}
        EDGEZERO__APP__RELEASE__SHA256: ${{ inputs['app-release-sha256'] }}
        EDGEZERO__APP__RELEASE__EXPECTED_SOURCE_REVISION: ${{ inputs['expected-source-revision'] }}
        EDGEZERO__APP__RELEASE__ROOT: ${{ steps.ws.outputs.root }}/release
        FASTLY_API_TOKEN: ""
        FASTLY_SERVICE_ID: ""
        FASTLY_TOKEN: ""
        FASTLY_KEY: ""
        FASTLY_API_KEY: ""
        FASTLY_AUTH_TOKEN: ""
        FASTLY_API_ENDPOINT: ""
        FASTLY_ENDPOINT: ""
        FASTLY_API_URL: ""
        FASTLY_PROFILE: ""
        FASTLY_SERVICE_NAME: ""
        FASTLY_DEBUG: ""
        FASTLY_DEBUG_MODE: ""
        FASTLY_CONFIG_FILE: ""
        FASTLY_CARGO_PROFILE: ""
        FASTLY_HOME: ""
      run: exec "$GITHUB_ACTION_PATH/../fastly-common/scripts/prepare-release.sh"

    - name: Extract application CLI
      id: cli
      shell: bash
      env:
        BASH_ENV: ""
        ENV: ""
        EDGEZERO__APP__CLI__ARCHIVE: ${{ steps.release.outputs['app-cli-archive'] }}
        EDGEZERO__ACTION__TOOL_ROOT: ${{ steps.ws.outputs.root }}/tools
        FASTLY_API_TOKEN: ""
        FASTLY_SERVICE_ID: ""
        FASTLY_TOKEN: ""
        FASTLY_KEY: ""
        FASTLY_API_KEY: ""
        FASTLY_AUTH_TOKEN: ""
        FASTLY_API_ENDPOINT: ""
        FASTLY_ENDPOINT: ""
        FASTLY_API_URL: ""
        FASTLY_PROFILE: ""
        FASTLY_SERVICE_NAME: ""
        FASTLY_DEBUG: ""
        FASTLY_DEBUG_MODE: ""
        FASTLY_CONFIG_FILE: ""
        FASTLY_CARGO_PROFILE: ""
        FASTLY_HOME: ""
      run: exec "$GITHUB_ACTION_PATH/../deploy-core/scripts/download-app-cli.sh"

    - name: Healthcheck
      id: health
      shell: bash
      env:
        BASH_ENV: ""
        ENV: ""
        EDGEZERO__ACTION__WORKSPACE: ${{ steps.ws.outputs.root }}
        EDGEZERO__APP__CLI__PATH: ${{ steps.cli.outputs['app-cli-path'] }}
        EDGEZERO__LIFECYCLE__SERVICE_ID: ${{ inputs['fastly-service-id'] }}
        EDGEZERO__LIFECYCLE__VERSION: ${{ inputs['fastly-version'] }}
        EDGEZERO__LIFECYCLE__DOMAIN: ${{ inputs.domain }}
        EDGEZERO__LIFECYCLE__PATH: ${{ inputs.path }}
        EDGEZERO__LIFECYCLE__RETRY: ${{ inputs.retry }}
        EDGEZERO__LIFECYCLE__RETRY_DELAY: ${{ inputs['retry-delay'] }}
        EDGEZERO__LIFECYCLE__TIMEOUT: ${{ inputs.timeout }}
        EDGEZERO__DEPLOY__TO: ${{ inputs['deploy-to'] }}
        FASTLY_API_TOKEN: ${{ inputs['deploy-to'] == 'staging' && inputs['fastly-api-token'] || '' }}
        FASTLY_SERVICE_ID: ""
        FASTLY_TOKEN: ""
        FASTLY_KEY: ""
        FASTLY_API_KEY: ""
        FASTLY_AUTH_TOKEN: ""
        FASTLY_API_ENDPOINT: ""
        FASTLY_ENDPOINT: ""
        FASTLY_API_URL: ""
        FASTLY_PROFILE: ""
        FASTLY_SERVICE_NAME: ""
        FASTLY_DEBUG: ""
        FASTLY_DEBUG_MODE: ""
        FASTLY_CONFIG_FILE: ""
        FASTLY_CARGO_PROFILE: ""
        FASTLY_HOME: ""
      run: exec "$GITHUB_ACTION_PATH/scripts/healthcheck.sh"

    - name: Cleanup
      if: ${{ always() }}
      shell: bash
      env:
        BASH_ENV: ""
        ENV: ""
        EDGEZERO__ACTION__WORKSPACE: ${{ steps.ws.outputs.root }}
        EDGEZERO__ACTION__TOOL_ROOT: ${{ steps.ws.outputs.root }}/tools
        FASTLY_API_TOKEN: ""
        FASTLY_SERVICE_ID: ""
        FASTLY_TOKEN: ""
        FASTLY_KEY: ""
        FASTLY_API_KEY: ""
        FASTLY_AUTH_TOKEN: ""
        FASTLY_API_ENDPOINT: ""
        FASTLY_ENDPOINT: ""
        FASTLY_API_URL: ""
        FASTLY_PROFILE: ""
        FASTLY_SERVICE_NAME: ""
        FASTLY_DEBUG: ""
        FASTLY_DEBUG_MODE: ""
        FASTLY_CONFIG_FILE: ""
        FASTLY_CARGO_PROFILE: ""
        FASTLY_HOME: ""
      run: exec "$GITHUB_ACTION_PATH/../deploy-core/scripts/cleanup.sh"
