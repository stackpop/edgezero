        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/.edgezero-gate/.github/docker/build-app-cli/assert-build-container-completion.sh" \
            --file "$RUNNER_TEMP/edgezero-build-container-pin-completion" \
            --kind pin

  build-container-release-preflight:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    environment:
      name: build-container-release
      deployment: false
    env:
      BASH_ENV: ""
      ENV: ""
    steps:
      - name: assert-hosted-runner-context
        shell: bash
        env:
          BASH_ENV: ""
          ENV: ""
          EDGEZERO_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          EDGEZERO_RUNNER_OS: ${{ runner.os }}
          EDGEZERO_RUNNER_ARCH: ${{ runner.arch }}
          EDGEZERO_REPOSITORY: ${{ github.repository }}
          EDGEZERO_WORKFLOW_REF: ${{ github.workflow_ref }}
          EDGEZERO_WORKFLOW_SHA: ${{ github.workflow_sha }}
          EDGEZERO_GITHUB_SHA: ${{ github.sha }}
          EDGEZERO_GATE_SHA: ${{ vars.EDGEZERO_BUILD_CONTAINER_GATE_SHA }}
        run: |
          set -euo pipefail
          [[ "$EDGEZERO_RUNNER_ENVIRONMENT" == github-hosted ]]
          [[ "$EDGEZERO_RUNNER_OS" == Linux ]]
          [[ "$EDGEZERO_RUNNER_ARCH" == X64 ]]
          [[ "$EDGEZERO_REPOSITORY" == stackpop/edgezero ]]
          [[ "$EDGEZERO_WORKFLOW_REF" == stackpop/edgezero/.github/workflows/build-container-ci.yml@refs/heads/main ]]
          [[ "$EDGEZERO_GATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EDGEZERO_GATE_SHA" != 0000000000000000000000000000000000000000 ]]
          [[ "$EDGEZERO_WORKFLOW_SHA" == "$EDGEZERO_GITHUB_SHA" ]]

      - name: checkout-active-gate
        if: ${{ success() }}
        uses: actions/checkout@v7.0.1
        with:
          repository: stackpop/edgezero
          ref: ${{ vars.EDGEZERO_BUILD_CONTAINER_GATE_SHA }}
          path: .edgezero-gate
          persist-credentials: false
          fetch-depth: 0

      - name: assert-exact-g-dispatch-context
        if: ${{ success() }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EDGEZERO_EVENT_NAME: ${{ github.event_name }}
          EDGEZERO_REPOSITORY: ${{ github.repository }}
          EDGEZERO_REF: ${{ github.ref }}
          EDGEZERO_REF_PROTECTED: ${{ github.ref_protected }}
          EDGEZERO_SHA: ${{ github.sha }}
          EDGEZERO_WORKFLOW_SHA: ${{ github.workflow_sha }}
          EDGEZERO_WORKFLOW_REF: ${{ github.workflow_ref }}
          EDGEZERO_GATE_SHA: ${{ vars.EDGEZERO_BUILD_CONTAINER_GATE_SHA }}
          EDGEZERO_RELEASE_STATE: ${{ vars.EDGEZERO_BUILD_CONTAINER_RELEASE_STATE }}
          EDGEZERO_CANDIDATE_PR_NUMBER: ${{ inputs.candidate-pr-number }}
          EDGEZERO_CANDIDATE_HEAD_REPOSITORY: ${{ inputs.candidate-head-repository }}
          EDGEZERO_CANDIDATE_HEAD_SHA: ${{ inputs.candidate-head-sha }}
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/.edgezero-gate/.github/docker/build-app-cli/assert-build-container-dispatch-context.sh" \
            --gate-root "$GITHUB_WORKSPACE/.edgezero-gate"

      - name: mint-publisher-probe-token
        id: publisher_probe
        if: ${{ success() }}
        uses: actions/create-github-app-token@v3.2.0
        with:
          app-id: ${{ vars.EDGEZERO_BUILD_CONTAINER_APP_ID }}
          private-key: ${{ secrets.EDGEZERO_BUILD_CONTAINER_APP_PRIVATE_KEY }}
          owner: stackpop
          repositories: edgezero
          permission-contents: write
          permission-pull-requests: write

      - name: verify-publisher-probe-token
        if: ${{ success() }}
        shell: bash
        env:
          EDGEZERO_APP_TOKEN: ${{ steps.publisher_probe.outputs.token }}
          EDGEZERO_INSTALLATION_ID: ${{ steps.publisher_probe.outputs.installation-id }}
          EDGEZERO_EXPECTED_INSTALLATION_ID: ${{ vars.EDGEZERO_BUILD_CONTAINER_APP_INSTALLATION_ID }}
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/.edgezero-gate/.github/docker/build-app-cli/assert-build-container-app-token.sh"
