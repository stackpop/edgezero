name: "Run Tests"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    name: ${{ matrix.suite }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [workspace, cli, axum, app-demo]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Cache Cargo dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
            tests/fixtures/reusable-app/target/
          key: ${{ runner.os }}-cargo-${{ matrix.suite }}-tests-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.suite }}-tests-

      - name: Retrieve Rust version
        id: rust-version
        run: echo "rust-version=$(grep '^rust ' .tool-versions | awk '{print $2}')" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Set up Rust tool chain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ steps.rust-version.outputs.rust-version }}
          components: clippy, rustfmt

      - name: Install wasm targets for generated-project checks
        if: matrix.suite == 'cli'
        run: rustup target add wasm32-wasip1 wasm32-wasip2 wasm32-unknown-unknown

      - name: Fetch dependencies (locked)
        run: cargo fetch --locked

      - name: No placeholder pins
        if: matrix.suite == 'workspace'
        run: ./scripts/check_no_placeholder_pins.sh

      - name: No legacy typed reads
        if: matrix.suite == 'workspace'
        run: ./scripts/check_no_legacy_typed_reads.sh

      - name: Nested AppConfig audit
        if: matrix.suite == 'cli'
        run: cargo run -q --bin check_no_nested_app_config --features nested-app-config-check -- examples/app-demo crates/edgezero-cli/src/templates

      - name: Nested AppConfig checker tests
        if: matrix.suite == 'cli'
        run: cargo test -p edgezero-cli --features nested-app-config-check --bin check_no_nested_app_config

      - name: Verify native request ingress harness
        if: matrix.suite == 'workspace'
        run: |
          cargo fmt --manifest-path tests/fixtures/request-fidelity-runner/Cargo.toml --all -- --check
          cargo test --manifest-path tests/fixtures/request-fidelity-runner/Cargo.toml --locked
          cargo clippy --manifest-path tests/fixtures/request-fidelity-runner/Cargo.toml --all-targets --locked -- -D warnings

      - name: Lifecycle fixture host tests
        if: matrix.suite == 'workspace'
        run: >-
          cargo test --locked
          --manifest-path tests/fixtures/reusable-app/Cargo.toml
          -p fixture-harness
          -p fixture-core

      - name: Check Axum lifecycle fixture
        if: matrix.suite == 'axum'
        run: >-
          cargo check --locked
          --manifest-path tests/fixtures/reusable-app/Cargo.toml
          -p fixture-axum

      - name: Run workspace tests
        if: matrix.suite == 'workspace'
        run: cargo test --workspace --all-targets

      - name: Run EdgeZero CLI tests
        if: matrix.suite == 'cli'
        run: cargo test -p edgezero-cli --all-targets

      - name: Adapter CLI dispatch tests
        if: matrix.suite == 'cli'
        run: >-
          cargo test
          -p edgezero-adapter-axum
          -p edgezero-adapter-cloudflare
          -p edgezero-adapter-fastly
          -p edgezero-adapter-spin
          --all-targets
          --no-default-features
          --features cli

      - name: Check feature compilation
        if: matrix.suite == 'workspace'
        run: cargo check --workspace --all-targets --features "fastly cloudflare spin"

      - name: Verify a generated project compiles
        if: matrix.suite == 'cli'
        run: cargo test -p edgezero-cli --test generated_project_builds -- --ignored

      - name: Run Axum host tests
        if: matrix.suite == 'axum'
        run: cargo test -p edgezero-adapter-axum --all-targets --features axum

      - name: Run app-demo workspace tests
        if: matrix.suite == 'app-demo'
        working-directory: examples/app-demo
        run: cargo test --locked --workspace --all-targets

  cargo-test:
    name: cargo test
    needs: host-tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every host test suite
        env:
          HOST_TESTS_RESULT: ${{ needs.host-tests.result }}
        run: test "$HOST_TESTS_RESULT" = success

  adapter-wasm-tests:
    name: ${{ matrix.adapter }} wasm tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - adapter: cloudflare
            target: wasm32-unknown-unknown
            runner_env: CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER
            runner_value: wasm-bindgen-test-runner
          - adapter: fastly
            target: wasm32-wasip1
            runner_env: CARGO_TARGET_WASM32_WASIP1_RUNNER
            runner_value: viceroy run
          - adapter: spin
            target: wasm32-wasip2
            runner_env: CARGO_TARGET_WASM32_WASIP2_RUNNER
            runner_value: wasmtime run -W component-model-async=y -S p3=y,http=y
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Cache Cargo dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.wasmtime/bin/
            target/
            tests/fixtures/reusable-app/target/
          key: ${{ runner.os }}-cargo-${{ matrix.adapter }}-${{ hashFiles('**/Cargo.lock', '.tool-versions') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.adapter }}-

      - name: Retrieve Rust version
        id: rust-version
        run: echo "rust-version=$(grep '^rust ' .tool-versions | awk '{print $2}')" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Set up Rust tool chain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ steps.rust-version.outputs.rust-version }}
          components: clippy, rustfmt

      - name: Add wasm target
        run: rustup target add ${{ matrix.target }}

      - name: Set up matching browser and driver
        if: matrix.adapter == 'cloudflare'
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: 154.0.8037.92
          install-chromedriver: true
          install-dependencies: true

      - name: Set up Node for local Worker tooling
        if: matrix.adapter == 'cloudflare'
        uses: actions/setup-node@v6
        with:
          node-version: 24.12.0
          cache: npm
          cache-dependency-path: tests/fixtures/request-fidelity/package-lock.json

      - name: Bind browser tests to pinned Chrome
        if: matrix.adapter == 'cloudflare'
        env:
          CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          node -e 'require("node:fs").writeFileSync(require("node:path").join(process.env.RUNNER_TEMP, "edgezero-webdriver.json"), JSON.stringify({"goog:chromeOptions": {binary: process.env.CHROME_BINARY}}))'

      - name: Resolve wasm-bindgen CLI version
        if: matrix.adapter == 'cloudflare'
        id: wasm-bindgen-version
        shell: bash
        run: |
          version="$(
            awk '
              $1 == "name" && $3 == "\"wasm-bindgen\"" { in_pkg=1; next }
              in_pkg && $1 == "version" {
                gsub(/"/, "", $3)
                print $3
                exit
              }
            ' Cargo.lock
          )"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # `--force` is required because the cargo cache may restore an existing
      # `~/.cargo/bin/<binary>` from a prior run, which `cargo install` rejects
      # by default. Force-overwriting is safe — `--locked` pins the version.
      - name: Install wasm-bindgen test runner
        if: matrix.adapter == 'cloudflare'
        env:
          WASM_BINDGEN_VERSION: ${{ steps.wasm-bindgen-version.outputs.version }}
        run: cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked --force

      - name: Resolve Viceroy version
        if: matrix.adapter == 'fastly'
        id: viceroy-version
        shell: bash
        run: echo "version=$(grep '^viceroy ' .tool-versions | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Setup Viceroy
        if: matrix.adapter == 'fastly'
        # Version comes from .tool-versions (single source of truth shared with
        # local dev).
        env:
          VICEROY_VERSION: ${{ steps.viceroy-version.outputs.version }}
        run: cargo install viceroy --version "$VICEROY_VERSION" --locked --force

      - name: Resolve Wasmtime version
        if: matrix.adapter == 'spin'
        id: wasmtime-version
        shell: bash
        run: echo "version=$(grep '^wasmtime ' .tool-versions | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Setup Wasmtime
        if: matrix.adapter == 'spin'
        # Direct GitHub-release tarball install. The official
        # `https://wasmtime.dev/install.sh` script broke as of
        # 2026-05-19 (interpolation failure: tried to download
        # version literal `{`), so we pin via .tool-versions and
        # land the binary in `~/.wasmtime/bin/` so the cache step
        # above actually short-circuits the download on subsequent
        # runs.
        #
        # The cache key now hashes `.tool-versions` too, so a
        # version bump invalidates the cached binary. We also
        # explicitly compare `wasmtime --version` against the pin
        # — without that a runner-provided wasmtime or a stale
        # cache hit would silently shadow the pinned version.
        env:
          WASMTIME_VERSION: ${{ steps.wasmtime-version.outputs.version }}
        run: |
          install_dir="$HOME/.wasmtime/bin"
          echo "$install_dir" >> "$GITHUB_PATH"
          export PATH="$install_dir:$PATH"
          version="$WASMTIME_VERSION"
          # Compare exact versions so a pin like `44.0.1` does not silently
          # accept `wasmtime 44.0.10` from a stale cache or runner-provided
          # binary.
          actual="$(wasmtime --version 2>/dev/null | awk '{print $2}' || true)"
          if [ "$actual" != "$version" ]; then
            tag="v${version}"
            archive="wasmtime-${tag}-x86_64-linux"
            mkdir -p "$install_dir"
            curl -fL "https://github.com/bytecodealliance/wasmtime/releases/download/${tag}/${archive}.tar.xz" -o /tmp/wasmtime.tar.xz
            tar -xJf /tmp/wasmtime.tar.xz -C /tmp
            install -m 0755 "/tmp/${archive}/wasmtime" "$install_dir/wasmtime"
          fi
          actual="$(wasmtime --version | awk '{print $2}')"
          test "$actual" = "$version"
          wasmtime --version

      - name: Fetch dependencies (locked)
        run: cargo fetch --locked

      - name: Run ${{ matrix.adapter }} wasm tests
        env:
          CHROMEDRIVER: ${{ steps.chrome.outputs.chromedriver-path }}
          WASM_BINDGEN_TEST_WEBDRIVER_JSON: ${{ runner.temp }}/edgezero-webdriver.json
          ${{ matrix.runner_env }}: ${{ matrix.runner_value }}
        run: cargo test -p edgezero-adapter-${{ matrix.adapter }} --features ${{ matrix.adapter }} --target ${{ matrix.target }} --test contract

      # The colocated runtime unit tests (config-store resolver, chunk
      # remediation) need the `fastly` feature and only RUN under Viceroy — the
      # `--test contract` line above never exercises them. Run the lib target so
      # the runtime fail-closed/remediation behaviour is actually verified in CI.
      - name: Run fastly wasm runtime unit tests
        if: matrix.adapter == 'fastly'
        env:
          ${{ matrix.runner_env }}: ${{ matrix.runner_value }}
        run: cargo test -p edgezero-adapter-fastly --features fastly --target wasm32-wasip1 --lib

      # Spin's metadata helper runs on the host; its full lib test artifact
      # imports Spin-specific interfaces unavailable in plain Wasmtime.
      # The real Spin HTTP fixture below executes the converter instead.
      - name: Install lock-matched worker-build
        if: matrix.adapter == 'cloudflare'
        run: cargo install worker-build --version 0.8.3 --locked --force

      - name: Install pinned Spin HTTP runtime
        if: matrix.adapter == 'spin'
        shell: bash
        run: |
          version="$(awk '$1 == "spin-cli" { gsub(/"/, "", $3); print $3; exit }' tests/fixtures/request-fidelity/Cargo.toml)"
          install_dir="$RUNNER_TEMP/spin"
          mkdir -p "$install_dir"
          curl -fL "https://github.com/spinframework/spin/releases/download/v${version}/spin-v${version}-linux-amd64.tar.gz" -o "$RUNNER_TEMP/spin.tar.gz"
          tar -xzf "$RUNNER_TEMP/spin.tar.gz" -C "$install_dir"
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/spin" --version

      - name: Check isolated fixture formatting
        run: cargo fmt --manifest-path tests/fixtures/request-fidelity/Cargo.toml --all -- --check

      - name: Lint isolated ingress fixture
        run: >-
          cargo clippy --manifest-path tests/fixtures/request-fidelity/Cargo.toml
          --features ${{ matrix.adapter }} --target ${{ matrix.target }}
          --all-targets --locked -- -D warnings

      - name: Run local HTTP ingress probes
        shell: bash
        run: |
          if [ "${{ matrix.adapter }}" = "cloudflare" ]; then
            WASM_BINDGEN_BIN="$(command -v wasm-bindgen)"
            export WASM_BINDGEN_BIN
          fi
          ./scripts/test-request-fidelity.sh ${{ matrix.adapter }}

      - name: Fastly reusable HTTP smoke
        if: matrix.adapter == 'fastly'
        run: ./scripts/smoke_test_reusable_app.sh --adapter fastly --suite smoke

      - name: Preserve Fastly lifecycle evidence
        if: always() && matrix.adapter == 'fastly'
        uses: actions/upload-artifact@v4
        with:
          name: fastly-lifecycle-evidence
          path: tests/fixtures/reusable-app/.runs/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

      - name: Check ${{ matrix.adapter }} wasm target
        run: cargo check -p edgezero-adapter-${{ matrix.adapter }} --features ${{ matrix.adapter }} --target ${{ matrix.target }}

      - name: Check ${{ matrix.adapter }} lifecycle fixture
        run: >-
          cargo check --locked
          --manifest-path tests/fixtures/reusable-app/Cargo.toml
          -p fixture-${{ matrix.adapter }}
          --target ${{ matrix.target }}
          --all-targets
