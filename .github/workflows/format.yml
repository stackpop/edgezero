name: "Run Format"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Cache cargo dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Retrieve Rust version
        id: rust-version
        run: echo "rust-version=$(grep '^rust ' .tool-versions | awk '{print $2}')" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Set up rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: "clippy, rustfmt"
          toolchain: ${{ steps.rust-version.outputs.rust-version }}

      - name: Fetch dependencies (locked)
        run: cargo fetch --locked

      - name: Run cargo fmt
        run: cargo fmt --all -- --check

      - name: Run cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # The all-features build unifies the fastly adapter's `cli` and `fastly`
      # features, which can MASK a dead-code or cfg mistake that only surfaces in
      # one supported mode. Gate the two the matrix above does not: `cli` alone
      # (native CLI host code) and no features at all (the declared default).
      - name: Run cargo clippy (fastly adapter, cli feature only)
        run: cargo clippy -p edgezero-adapter-fastly --features cli --all-targets -- -D warnings

      - name: Run cargo clippy (fastly adapter, no default features)
        run: cargo clippy -p edgezero-adapter-fastly --no-default-features --lib -- -D warnings

      # Plan task 8.3 corollary: `examples/app-demo` is excluded
      # from the root workspace, so the fmt/clippy steps above
      # don't cover it. Run the same gates against it explicitly
      # — the app-demo workspace has the same strict-clippy
      # config and is the showcase a new user clones.
      - name: Run cargo fmt (app-demo workspace)
        working-directory: examples/app-demo
        run: cargo fmt --all -- --check

      - name: Run cargo clippy (app-demo workspace)
        working-directory: examples/app-demo
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  adapter-clippy:
    name: ${{ matrix.check_name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - adapter: cloudflare
            target: wasm32-unknown-unknown
            check_name: cloudflare wasm clippy
            feature_sets: |-
              cloudflare
              cloudflare,test-utils
          - adapter: fastly
            target: wasm32-wasip1
            check_name: fastly wasm clippy
            # The `cli` feature is valid on wasip1. Lint it independently so
            # feature unification cannot mask target-specific cfg mistakes.
            feature_sets: |-
              fastly
              fastly,cli
              fastly,test-utils
              fastly,cli,test-utils
          - adapter: spin
            target: wasm32-wasip2
            check_name: spin wasm clippy
            feature_sets: |-
              spin
              spin,test-utils
          - adapter: axum
            target: native
            check_name: axum native clippy
            feature_sets: |-
              axum
              axum,test-utils
    steps:
      - uses: actions/checkout@v6

      - name: Cache Cargo dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ matrix.adapter }}-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.adapter }}-clippy-

      - name: Retrieve Rust version
        id: rust-version
        run: echo "rust-version=$(grep '^rust ' .tool-versions | awk '{print $2}')" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Set up Rust tool chain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ steps.rust-version.outputs.rust-version }}
          components: clippy

      - name: Add wasm target
        if: matrix.target != 'native'
        run: rustup target add ${{ matrix.target }}

      - name: Fetch dependencies (locked)
        run: cargo fetch --locked

      - name: Clippy ${{ matrix.adapter }} feature combinations on ${{ matrix.target }}
        env:
          ADAPTER: ${{ matrix.adapter }}
          FEATURE_SETS: ${{ matrix.feature_sets }}
          TARGET: ${{ matrix.target }}
        run: |
          target_args=()
          if [[ "${TARGET}" != "native" ]]; then
            target_args=(--target "${TARGET}")
          fi

          while IFS= read -r features; do
            echo "==> edgezero-adapter-${ADAPTER} ${TARGET} features=[${features}]"
            cargo clippy \
              --package "edgezero-adapter-${ADAPTER}" \
              --no-default-features \
              --features "${features}" \
              "${target_args[@]}" \
              --all-targets \
              -- \
              -D warnings
          done <<<"${FEATURE_SETS}"

  format-docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs

    steps:
      - uses: actions/checkout@v6

      - name: Retrieve Node.js version
        id: node-version
        working-directory: .
        run: echo "node-version=$(grep '^nodejs ' .tool-versions | awk '{print $2}')" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.node-version.outputs.node-version }}
          cache: "npm"
          cache-dependency-path: docs/package.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier (check)
        run: npm run format

      - name: Check outbound documentation contract
        working-directory: .
        run: node scripts/check_outbound_docs_contract.mjs

      - name: Build documentation
        run: npm run build
